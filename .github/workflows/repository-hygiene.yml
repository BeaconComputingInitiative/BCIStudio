# SHA-256: see docs/HYGIENE_SHA256SUMS
name: Repository hygiene
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify hygiene file integrity
        run: sha256sum -c docs/HYGIENE_SHA256SUMS
      - name: Prevent new repository clutter
        run: python3 tools/repository_hygiene.py --baseline cca059b6edbed5d4eb59d0e53c07d8b1b54e9c04
